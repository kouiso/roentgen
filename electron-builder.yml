appId: com.kouiso.roentgen
productName: Roentgen
copyright: Copyright © 2026 kouiso

directories:
  output: release
  buildResources: build

# --publish neverでもlatest-*.ymlの自動更新メタデータ生成は
# publishConfigの解決可否に依存する（.git/configからの自動検出に頼らない）。
# CI環境で検出が失敗するとrelease:gateがlatest-linux.ymlを見つけられず落ちるため、
# GitHub Releaseをプロバイダとして明示する。
publish:
  - provider: github
    owner: kouiso
    repo: roentgen

files:
  - dist/**/*
  - dist-electron/**/*
  - '!**/*.map'
  - '!dist/**/*.dcm'
  - '!dist/**/*.dicom'
  - '!node_modules/**/*.map'

mac:
  category: public.app-category.medical
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  darkModeSupport: true

dmg:
  artifactName: ${productName}-${version}-${arch}.dmg

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.exe

linux:
  category: Science;MedicalSoftware
  icon: icons
  artifactName: ${productName}-${version}.${ext}
  target:
    - target: AppImage
      arch:
        - x64

