version: "3"

tasks:
  ci:fast:
    desc: Run the shared lint, typecheck, unit and build verification.
    cmds:
      - pnpm install --frozen-lockfile
      - node --test .github/ci/*.test.mjs
      - node .github/ci/run.mjs fast

  ci:
    desc: Run shared verification plus renderer and Electron E2E.
    cmds:
      - pnpm install --frozen-lockfile
      - node --test .github/ci/*.test.mjs
      - node .github/ci/run.mjs full
