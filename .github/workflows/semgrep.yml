name: Semgrep Code Scan

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Code Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # :latest だとスキャン結果が再現しないためバージョン固定
      image: semgrep/semgrep:1.168.0
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4

      - run: semgrep scan --config auto
