name: Verify release gate (manual, no publish)

on:
  workflow_dispatch:

jobs:
  release-gate:
    name: Release gate (dry run)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package (AppImage)
        run: pnpm dist --linux --publish never

      - name: Generate checksums
        run: |
          pnpm release:checksums
          cp release/SHA256SUMS.txt release/SHA256SUMS-linux.txt

      - name: Release gate
        run: pnpm release:gate
