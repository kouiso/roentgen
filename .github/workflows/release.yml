name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# リリースは途中中断させない（cancel-in-progress: false）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Shared CI entry contracts
        run: node --test .github/ci/*.test.mjs

      - name: Verify headless gates
        run: node .github/ci/run.mjs quality

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Renderer headless E2E
        run: node .github/ci/run.mjs renderer

  build-mac:
    name: Build (macOS)
    # build-linuxのrelease:gateが通るまで公開させない（macOS/Windowsの成果物だけ
    # 先にリリースへ公開され、後からLinux側のゲート失敗が発覚する事故を防ぐ）。
    needs: [quality-gates, build-linux]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package (dmg)
        run: pnpm dist --mac --publish never

      - name: Generate checksums
        run: node scripts/generate-release-checksums.mjs --output "release/SHA256SUMS-macos.txt"

      - name: Publish artifacts and checksums
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/SHA256SUMS-macos.txt

  build-win:
    name: Build (Windows)
    # build-macと同様、build-linuxのrelease:gateを待ってから公開する。
    needs: [quality-gates, build-linux]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package (nsis)
        run: pnpm dist --win --publish never

      - name: Generate checksums
        run: node scripts/generate-release-checksums.mjs --output "release/SHA256SUMS-windows.txt"

      - name: Publish artifacts and checksums
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS-windows.txt

  build-linux:
    name: Build (Linux)
    needs: quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # なぜ: バイナリの ldd 検査に必要な共有ライブラリはこのホストにも導入する。
      - name: Install Linux runtime libraries
        run: pnpm exec playwright install-deps chromium

      # なぜ: 同じ SHA と Linux/Node 設定の検査は依存先 quality-gates が済ませる。
      # OS 別ビルド・配布物検査・公開はこの job のまま維持する。

      - name: Build
        run: pnpm build

      - name: Package (AppImage)
        run: pnpm dist --linux --publish never

      - name: Generate checksums
        run: |
          pnpm release:checksums
          cp release/SHA256SUMS.txt release/SHA256SUMS-linux.txt

      - name: Release gate
        run: pnpm release:gate

      - name: Publish artifacts and checksums
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/*.AppImage
            release/latest-linux.yml
            release/SHA256SUMS-linux.txt
